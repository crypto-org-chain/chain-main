codecov:
  # Only post codecov status once the CI run that produced the coverage has
  # succeeded, so a mid-run partial upload can never flip the status red
  # while other jobs are still running / will soon replace its data.
  require_ci_to_pass: yes
  notify:
    # Wait for the 11 unconditional integration uploads before computing the
    # final status, otherwise codecov reports off an incomplete subset and
    # shows spurious drops. Upgrade and unit-test uploads are conditional.
    after_n_builds: 11

coverage:
  precision: 2
  round: down
  range: 70...100

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # New/changed lines should reach a sensible coverage bar; flagged
        # informational so a single miss does not block a PR merge.
        target: 70%
        threshold: 5%
        informational: true
    changes: false

# Unit-test and upgrade jobs only run on matching path changes, so reuse their
# last uploaded coverage when skipped instead of reporting a drop. The other
# flags always upload, so a missing report there stays visible.
flag_management:
  individual_flags:
    - name: unit_tests
      carryforward: true
    - name: integration_tests_upgrade
      carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  - "docs"
  - "**/*.md"
  - "**/*.rst"
  # Generated protobuf / grpc-gateway / pulsar sources.
  - "**/*.pb.go"
  - "**/*.pb.gw.go"
  - "**/*.pulsar.go"
  # Generated python protobuf for pystarport.
  - "pystarport/proto_python"
  # Cosmos SDK expected-keeper interface files are pass-through aliases.
  - "**/expected_keepers.go"
  # Test harness / simulation helpers.
  - "app/sim_test.go"
  - "app/test_helpers.go"
  - "tests"
